// coach.cfg - quick bot match with server-side demo recording
// Put this file in: .../Counter-Strike Global Offensive/game/csgo/cfg/
// Use: exec coach -> type a map (dust2, mirage...) -> once loaded type go -> play -> done
tv_enable 1
game_type 0
game_mode 1

// map shortcuts
alias dust2 "map de_dust2"
alias mirage "map de_mirage"
alias inferno "map de_inferno"
alias nuke "map de_nuke"
alias ancient "map de_ancient"
alias anubis "map de_anubis"

// after the map loads (loading a map resets these, so they can't go above)
alias go "mp_maxrounds 3; bot_difficulty 2; mp_warmup_end; tv_record coach"
alias done "tv_stoprecord"

echo "coach.cfg loaded: type a map (dust2, mirage, inferno...), then 'go', then 'done' when finished"
